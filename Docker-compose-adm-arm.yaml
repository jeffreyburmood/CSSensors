
# this docker compose file contains the instructions to launch and orchestrate the following containers:
# - neo4j database for administration data
# - neo4j dataserver for administration data
# - administration application

name: cabinadmin

services:
  admin:
    # cabindock/healthcheck:latest-amd
    image: cabindock/admin:latest-arm
    container_name: admin
    environment:
      - NEO4J_ADMIN_API_URL=http://neo4j-adm-dataserver:8000
      - LOG_LEVEL=INFO
    networks:
      - cabin-network
    depends_on:
      - neo4j-adm-db
      - neo4j-adm-dataserver

  neo4j-adm-dataserver:
    # image: cabindock/neo4j-adm-dataserver:latest-amd
    image: cabindock/neo4j-adm-dataserver:latest-arm
    container_name: neo4j-adm-dataserver
    ports:
      - "8000:8000"
    environment:
      - NEO4J_ADM_CONNECTION_STR=bolt://neo4j-adm-db:7687
      - LOG_LEVEL=INFO
    networks:
      - cabin-network
    depends_on:
      - neo4j-adm-db

  neo4j-adm-db:
    image: neo4j:2026.04.0-community-ubi10
    container_name: neo4j-adm-db
    restart: always
    ports:
      - "7476:7474"
      - "7689:7687"
    environment:
      - NEO4J_AUTH=none
    volumes:
      # - /mnt/neo4j/environment/data:/data
      - /Users/jeffrey/SynologyDrive/database/neo4j-test-admin/data:/data
    networks:
      - cabin-network

networks:
  cabin-network:
    external: true
