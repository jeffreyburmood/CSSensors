
name: cssnats

services:
  nats-server-1:
    image: nats:2.12.8-alpine
    container_name: nats-server-1
    restart: unless-stopped
    volumes:
      - ./Nats/nats-server-1-arm.conf:/etc/nats/nats-server-1-arm.conf:ro
    command: ["-c", "/etc/nats/nats-server-1-arm.conf"]
    ports:
      - "4222:4222"
      - "8222:8222"
      - "6222:6222"
    networks:
      - cabin-network

  nats-server-2:
    image: nats:2.12.8-alpine
    container_name: nats-server-2
    restart: unless-stopped
    volumes:
      - ./Nats/nats-server-2-arm.conf:/etc/nats/nats-server-2-arm.conf:ro
    command: ["-c", "/etc/nats/nats-server-2-arm.conf"]
    ports:
      - "4223:4222"
      - "8223:8222"
      - "6223:6222"
    networks:
      - cabin-network

  nats-server-3:
    image: nats:2.12.8-alpine
    container_name: nats-server-3
    restart: unless-stopped
    volumes:
      - ./Nats/nats-server-3-arm.conf:/etc/nats/nats-server-3-arm.conf:ro
    command: ["-c", "/etc/nats/nats-server-3-arm.conf"]
    ports:
      - "4224:4222"
      - "8224:8222"
      - "6224:6222"
    networks:
      - cabin-network

  nats-server-4:
    image: nats:2.12.8-alpine
    container_name: nats-server-4
    restart: unless-stopped
    volumes:
      - ./Nats/nats-server-4-arm.conf:/etc/nats/nats-server-4-arm.conf:ro
    command: ["-c", "/etc/nats/nats-server-4-arm.conf"]
    ports:
      - "4225:4222"
      - "8225:8222"
      - "6225:6222"
    networks:
      - cabin-network

networks:
  cabin-network:
    external: true
